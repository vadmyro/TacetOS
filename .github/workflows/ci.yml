name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest Qt version we support. Developers usually build with a newer one.
  QT_VERSION: '6.8.3'
  CLANG_FORMAT_VERSION: '22.1.8'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  build:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install libudev, libusb and dosfstools
        # libudev: the udev monitor of the device detection (without it the build still works
        # and polls). libusb: the USB access of the Classic install, only compiled, never run by
        # the tests. dosfstools: fsck.fat, the second reader of the FAT32 format tests (they
        # skip that check without it).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev dosfstools

      - name: Reference tool settings
        # Built outside the tree and only for the comparison tests, which are skipped without it.
        # The 2nd generation nano image goes through a loop disk (sudo), so this is Linux only.
        if: runner.os == 'Linux'
        run: |
          echo "TACETOS_REFERENCE_TOOLS_DIR=$RUNNER_TEMP/reference-tools" >> "$GITHUB_ENV"
          echo "TACETOS_REFERENCE_LOOP=1" >> "$GITHUB_ENV"
          echo "TACETOS_DFU_PARTS_DIR=$RUNNER_TEMP/dfu-parts" >> "$GITHUB_ENV"

      - name: Cache the reference partition tool
        if: runner.os == 'Linux'
        id: reference-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reference-tools/partition-tool
          key: reference-tools-${{ hashFiles('firmware/base.lock', 'tests/reference/build-reference-tools.sh') }}

      - name: Build the reference partition tool
        if: runner.os == 'Linux' && steps.reference-cache.outputs.cache-hit != 'true'
        # Called through bash: the scripts are not stored as executable in the repository.
        run: bash tests/reference/build-reference-tools.sh

      - name: Cache the ARM toolchain
        # Built from the pinned sources by build-dfu-parts.sh, which takes a while: kept.
        if: runner.os == 'Linux'
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}

      - name: Install the toolchain build tools
        # The toolchain script of the base sources stops at once without them. It looks
        # for the libtool program, which Ubuntu ships in libtool-bin, not in libtool.
        if: runner.os == 'Linux' && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison

      - name: Cache the Classic DFU parts
        if: runner.os == 'Linux'
        id: dfu-parts-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dfu-parts
          key: dfu-parts-${{ hashFiles('firmware/base.lock', 'tests/reference/build-dfu-parts.sh', 'tests/reference/extract-dfu-blocks.c') }}

      - name: Build the Classic DFU parts
        # The two fixed blocks, the two programs for the iPod and the reference tool that
        # builds images from them, for the Classic comparison test.
        if: runner.os == 'Linux' && steps.dfu-parts-cache.outputs.cache-hit != 'true'
        run: bash tests/reference/build-dfu-parts.sh --toolchain "$RUNNER_TEMP/toolchain"

      - name: Configure
        # Warnings are errors on Linux and macOS. Windows reports them only, for now.
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=${{ runner.os != 'Windows' && 'ON' || 'OFF' }} -DTACETOS_FETCH_FONT=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
