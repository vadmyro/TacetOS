name: CI

on:
  push:
    # A push that only changes text files does not start the CI. Order matters: a later
    # pattern wins, so the folders below always start it, notes in them included. The
    # logo of the app is read by the build, so it stays in too.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'docs/assets/**'
      - '.github/**'
      - 'firmware/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest Qt version we support. Developers usually build with a newer one.
  QT_VERSION: '6.8.3'
  CLANG_FORMAT_VERSION: '22.1.8'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  build:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only until v0.8, which brings back Windows and macOS (windows-2025,
        # macos-15-intel) with every other supported system. The Windows and macOS
        # steps below stay in place for that.
        os: [ubuntu-24.04]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install libudev, libusb and dosfstools
        # libudev: the udev monitor of the device detection (without it the build still works
        # and polls). libusb: the USB access of the Classic install, only compiled, never run by
        # the tests. dosfstools: fsck.fat, the second reader of the FAT32 format tests (they
        # skip that check without it).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev dosfstools

      - name: Reference tool settings
        # Built outside the tree and only for the comparison tests, which are skipped without it.
        # The 2nd generation nano image goes through a loop disk (sudo), so this is Linux only.
        if: runner.os == 'Linux'
        run: |
          echo "TACETOS_REFERENCE_TOOLS_DIR=$RUNNER_TEMP/reference-tools" >> "$GITHUB_ENV"
          echo "TACETOS_REFERENCE_LOOP=1" >> "$GITHUB_ENV"
          echo "TACETOS_DFU_PARTS_DIR=$RUNNER_TEMP/dfu-parts" >> "$GITHUB_ENV"

      - name: Cache the reference partition tool
        if: runner.os == 'Linux'
        id: reference-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reference-tools/partition-tool
          key: reference-tools-${{ hashFiles('firmware/base.lock', 'tests/reference/build-reference-tools.sh') }}

      - name: Build the reference partition tool
        if: runner.os == 'Linux' && steps.reference-cache.outputs.cache-hit != 'true'
        # Called through bash: the scripts are not stored as executable in the repository.
        run: bash tests/reference/build-reference-tools.sh

      - name: Restore the ARM toolchain
        # Built from the pinned sources by build-dfu-parts.sh, which takes a while: kept.
        # Saved right after it is built (below), so that a failing test does not lose it.
        if: runner.os == 'Linux'
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}

      - name: Install the toolchain build tools
        # The toolchain script of the base sources stops at once without them. It looks
        # for the libtool program, which Ubuntu ships in libtool-bin, not in libtool.
        if: runner.os == 'Linux' && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison

      - name: Restore the Classic DFU parts
        if: runner.os == 'Linux'
        id: dfu-parts-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dfu-parts
          key: dfu-parts-${{ hashFiles('firmware/base.lock', 'tests/reference/build-dfu-parts.sh', 'tests/reference/extract-dfu-blocks.c') }}

      - name: Build the Classic DFU parts
        # The two fixed blocks, the two programs for the iPod and the reference tool that
        # builds images from them, for the Classic comparison test.
        if: runner.os == 'Linux' && steps.dfu-parts-cache.outputs.cache-hit != 'true'
        id: dfu-parts-build
        run: bash tests/reference/build-dfu-parts.sh --toolchain "$RUNNER_TEMP/toolchain"

      - name: Save the ARM toolchain
        if: runner.os == 'Linux' && steps.toolchain-cache.outputs.cache-hit != 'true' && steps.dfu-parts-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save the Classic DFU parts
        if: runner.os == 'Linux' && steps.dfu-parts-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dfu-parts
          key: ${{ steps.dfu-parts-cache.outputs.cache-primary-key }}

      - name: Configure
        # Warnings are errors on Linux and macOS. Windows reports them only, for now.
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=${{ runner.os != 'Windows' && 'ON' || 'OFF' }} -DTACETOS_FETCH_FONT=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        # Without a console (Windows runners), Qt sends its messages to the debugger,
        # and a test that stops on a fatal error shows nothing in the log. The runners have
        # 4 cores: the tests share them (a test that needs to be alone says so with RUN_SERIAL).
        env:
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --preset ${{ matrix.preset }} --parallel 4

  firmware:
    # The firmware package of the iPod Classic (firmware/README.md, "Package"). The other
    # models come later. The package is kept as an artifact of the run, never in a release.
    name: firmware (ipod6g)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore the ARM toolchain
        # The same cache as the build job, read only: that job saves it.
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}

      - name: Install the toolchain build tools
        # Only when the cache is empty: build.sh then builds the toolchain itself.
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison

      - name: Install Pillow
        # brand.sh draws the TacetOS logo and icon into the base's images.
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Get the base sources, apply our patches and our branding
        run: bash firmware/apply.sh --dest "$RUNNER_TEMP/fw/src"

      - name: Build the firmware
        run: bash firmware/build.sh --target ipod6g --type N --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out" --toolchain "$RUNNER_TEMP/toolchain"

      - name: Build the bootloader
        run: bash firmware/build.sh --target ipod6g --type B --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out" --toolchain "$RUNNER_TEMP/toolchain"

      - name: Check the branding of the builds
        run: |
          bash firmware/check-build.sh --self-test
          bash firmware/check-build.sh --target ipod6g --types N,B --plugins --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out"

      - name: Package
        run: bash firmware/package.sh --target ipod6g --in "$RUNNER_TEMP/fw/out" --out "$RUNNER_TEMP/fw/package"

      - name: Check the package against its manifest
        working-directory: ${{ runner.temp }}/fw/package
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, sys
          manifests = glob.glob("*.json")
          if len(manifests) != 1:
              sys.exit(f"expected one manifest, found {len(manifests)}")
          data = json.load(open(manifests[0], encoding="utf-8"))
          assert data["format"] == 1 and data["target"] == "ipod6g", data
          listed = {f["name"] for f in data["files"]}
          present = set(os.listdir(".")) - set(manifests)
          if listed != present:
              sys.exit(f"files listed {sorted(listed)} but present {sorted(present)}")
          for f in data["files"]:
              digest = hashlib.sha256(open(f["name"], "rb").read()).hexdigest()
              if digest != f["sha256"] or os.path.getsize(f["name"]) != f["size"]:
                  sys.exit(f"{f['name']}: size or sha256 does not match the manifest")
              print(f"{f['name']}: {f['size']} bytes, sha256 ok")
          PY

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: tacetos-ipod6g
          path: ${{ runner.temp }}/fw/package/
          retention-days: 30
          if-no-files-found: error
