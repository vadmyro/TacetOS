name: CI

on:
  push:
    # A push that only changes text files does not start the CI. Order matters: a later
    # pattern wins, so the folders below always start it, notes in them included. The
    # logo of the app is read by the build, so it stays in too.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'docs/assets/**'
      - '.github/**'
      - 'firmware/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
    # Every branch, and the release tags. With tags alone, a push to a branch would no
    # longer start the CI. GitHub does not apply the paths above to a tag.
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest Qt version we support. Developers usually build with a newer one.
  QT_VERSION: '6.8.3'
  CLANG_FORMAT_VERSION: '22.1.8'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  build:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only until v0.8, which brings back Windows and macOS (windows-2025,
        # macos-15-intel) with every other supported system. The Windows and macOS
        # steps below stay in place for that.
        os: [ubuntu-24.04]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install libudev, libusb and dosfstools
        # libudev: the udev monitor of the device detection (without it the build still works
        # and polls). libusb: the USB access of the Classic install, only compiled, never run by
        # the tests. dosfstools: fsck.fat, the second reader of the FAT32 format tests (they
        # skip that check without it).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev dosfstools

      - name: Reference tool settings
        # Built outside the tree and only for the comparison tests, which are skipped without it.
        # The 2nd generation nano image goes through a loop disk (sudo), so this is Linux only.
        if: runner.os == 'Linux'
        run: |
          echo "TACETOS_REFERENCE_TOOLS_DIR=$RUNNER_TEMP/reference-tools" >> "$GITHUB_ENV"
          echo "TACETOS_REFERENCE_LOOP=1" >> "$GITHUB_ENV"
          echo "TACETOS_DFU_PARTS_DIR=$RUNNER_TEMP/dfu-parts" >> "$GITHUB_ENV"

      - name: Cache the reference partition tool
        if: runner.os == 'Linux'
        id: reference-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reference-tools/partition-tool
          key: reference-tools-${{ hashFiles('firmware/base.lock', 'tests/reference/build-reference-tools.sh') }}

      - name: Build the reference partition tool
        if: runner.os == 'Linux' && steps.reference-cache.outputs.cache-hit != 'true'
        # Called through bash: the scripts are not stored as executable in the repository.
        run: bash tests/reference/build-reference-tools.sh

      - name: Restore the ARM toolchain
        # Built from the pinned sources by build-dfu-parts.sh, which takes a while: kept.
        # Saved right after it is built (below), so that a failing test does not lose it.
        if: runner.os == 'Linux'
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}

      - name: Install the toolchain build tools
        # The toolchain script of the base sources stops at once without them. It looks
        # for the libtool program, which Ubuntu ships in libtool-bin, not in libtool.
        if: runner.os == 'Linux' && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison

      - name: Restore the Classic DFU parts
        if: runner.os == 'Linux'
        id: dfu-parts-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dfu-parts
          key: dfu-parts-${{ hashFiles('firmware/base.lock', 'firmware/brand.sh', 'firmware/patches/dfu/*.patch', 'tests/reference/build-dfu-parts.sh', 'tests/reference/extract-dfu-blocks.c') }}

      - name: Install Pillow for the DFU parts
        # build-dfu-parts.sh runs brand.sh, which draws the TacetOS logo. python3 here is the
        # one that install-qt-action set up, so Pillow comes from pip, not from apt.
        if: runner.os == 'Linux' && steps.dfu-parts-cache.outputs.cache-hit != 'true'
        run: python3 -m pip install Pillow

      - name: Build the Classic DFU parts
        # The two fixed blocks, the two programs for the iPod and the reference tool that
        # builds images from them, for the Classic comparison test.
        if: runner.os == 'Linux' && steps.dfu-parts-cache.outputs.cache-hit != 'true'
        id: dfu-parts-build
        run: bash tests/reference/build-dfu-parts.sh --toolchain "$RUNNER_TEMP/toolchain"

      - name: Save the ARM toolchain
        if: runner.os == 'Linux' && steps.toolchain-cache.outputs.cache-hit != 'true' && steps.dfu-parts-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save the Classic DFU parts
        if: runner.os == 'Linux' && steps.dfu-parts-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dfu-parts
          key: ${{ steps.dfu-parts-cache.outputs.cache-primary-key }}

      - name: Configure
        # Warnings are errors on Linux and macOS. Windows reports them only, for now.
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=${{ runner.os != 'Windows' && 'ON' || 'OFF' }} -DTACETOS_FETCH_FONT=ON

      - name: Build
        # A bound on the jobs: without a number, make starts every file at once and the
        # runner runs out of memory, which GitHub reports as a cancelled job.
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        # Without a console (Windows runners), Qt sends its messages to the debugger,
        # and a test that stops on a fatal error shows nothing in the log. The runners have
        # 4 cores: the tests share them (a test that needs to be alone says so with RUN_SERIAL).
        env:
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --preset ${{ matrix.preset }} --parallel 4

  firmware-prepare:
    # Runs once before the firmware builds: lists the models and makes sure the ARM
    # toolchain is in the cache, so that the ten builds never make it themselves.
    name: firmware (prepare)
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.models.outputs.targets }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version of the packages
        # One version for every model (update-channel.md, section 5). On a tag that is not
        # the project version, version.sh fails here, before anything is built.
        id: version
        run: echo "version=$(bash firmware/version.sh)" >> "$GITHUB_OUTPUT"

      - name: List the models
        # One build per model of models/models.toml, named by its bootloader target.
        id: models
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, tomllib
          with open("models/models.toml", "rb") as f:
              targets = [m["bootloader_target"] for m in tomllib.load(f)["model"]]
          if not targets:
              raise SystemExit("no model in models/models.toml")
          print("targets=" + json.dumps(targets))
          PY

      - name: Check the branding rules
        run: bash firmware/check-build.sh --self-test

      - name: Look for the ARM toolchain
        # The same key as the build job, which may also save it. Only looked up here.
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}
          lookup-only: true

      - name: Install the toolchain build tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison python3-pil

      - name: Build the ARM toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          bash firmware/apply.sh --dest "$RUNNER_TEMP/fw/src"
          bash firmware/build.sh --toolchain-only --src "$RUNNER_TEMP/fw/src" --toolchain "$RUNNER_TEMP/toolchain"

      - name: Save the ARM toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

  firmware:
    # The firmware package of each model (firmware/README.md, "Package"), kept as an
    # artifact of the run, never in a release.
    name: firmware (${{ matrix.target }})
    needs: firmware-prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.firmware-prepare.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore the ARM toolchain
        # Read only: the prepare job saves it.
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: toolchain-${{ hashFiles('firmware/base.lock') }}

      - name: Install the toolchain build tools
        # Only when the cache is empty anyway: build.sh then builds the toolchain itself.
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y texinfo autoconf automake libtool libtool-bin flex bison

      - name: Install Pillow
        # brand.sh draws the TacetOS logo and icon into the base's images.
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Get the base sources, apply our patches and our branding
        run: bash firmware/apply.sh --dest "$RUNNER_TEMP/fw/src"

      - name: Build the firmware
        run: bash firmware/build.sh --target "$TARGET" --type N --version "${{ needs.firmware-prepare.outputs.version }}" --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out" --toolchain "$RUNNER_TEMP/toolchain"

      - name: Build the bootloader
        run: bash firmware/build.sh --target "$TARGET" --type B --version "${{ needs.firmware-prepare.outputs.version }}" --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out" --toolchain "$RUNNER_TEMP/toolchain"

      - name: Check the branding of the builds
        # The listed plugins the base does not build for this model are shown first (branding 7.7).
        run: |
          echo "Listed plugins the base does not build for $TARGET:"
          cat "$RUNNER_TEMP/fw/out/$TARGET-plugins-absent.txt"
          bash firmware/check-build.sh --target "$TARGET" --types N,B --plugins --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out"

      - name: Package
        run: bash firmware/package.sh --target "$TARGET" --version "${{ needs.firmware-prepare.outputs.version }}" --in "$RUNNER_TEMP/fw/out" --out "$RUNNER_TEMP/fw/package"

      - name: Check the package against its manifest
        working-directory: ${{ runner.temp }}/fw/package
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, sys
          manifests = glob.glob("*.json")
          if len(manifests) != 1:
              sys.exit(f"expected one manifest, found {len(manifests)}")
          data = json.load(open(manifests[0], encoding="utf-8"))
          assert data["format"] == 1 and data["target"] == os.environ["TARGET"], data
          listed = {f["name"] for f in data["files"]}
          present = set(os.listdir(".")) - set(manifests)
          if listed != present:
              sys.exit(f"files listed {sorted(listed)} but present {sorted(present)}")
          for f in data["files"]:
              digest = hashlib.sha256(open(f["name"], "rb").read()).hexdigest()
              if digest != f["sha256"] or os.path.getsize(f["name"]) != f["size"]:
                  sys.exit(f"{f['name']}: size or sha256 does not match the manifest")
              print(f"{f['name']}: {f['size']} bytes, sha256 ok")
          PY

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: tacetos-${{ matrix.target }}
          path: ${{ runner.temp }}/fw/package/
          retention-days: 30
          if-no-files-found: error

  simulator:
    # The simulator of each model (a test tool, never in a release), kept as an artifact of
    # the run. It uses the host compiler: no ARM toolchain here.
    name: simulator (${{ matrix.target }})
    needs: firmware-prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.firmware-prepare.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL 2 and Pillow
        # SDL 2: the simulator draws its screen and reads its keys with it. Pillow: brand.sh
        # draws the TacetOS logo and icon into the base's images.
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev python3-pil

      - name: Get the base sources, apply our patches and our branding
        run: bash firmware/apply.sh --dest "$RUNNER_TEMP/fw/src"

      - name: Build the simulator
        run: bash firmware/build.sh --target "$TARGET" --type S --version "${{ needs.firmware-prepare.outputs.version }}" --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out"

      - name: Check the branding of the build
        run: bash firmware/check-build.sh --target "$TARGET" --types S --src "$RUNNER_TEMP/fw/src" --out "$RUNNER_TEMP/fw/out"

      - name: Keep the simulator
        uses: actions/upload-artifact@v7
        with:
          name: tacetos-sim-${{ matrix.target }}
          path: ${{ runner.temp }}/fw/out/
          retention-days: 30
          if-no-files-found: error

  release:
    # On a tag vX.Y.Z only: a draft release with the package of every model and the index
    # (update-channel.md, section 2). Never published by the CI (drafts until the beta).
    name: release (draft)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build, firmware-prepare, firmware, simulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.firmware-prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download firmware packages
        # Collect the packages from all 10 firmware job runs (one per target).
        # Only the firmware packages: the simulators (tacetos-sim-*) are not part of a release.
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/packages
          pattern: tacetos-ipod*

      - name: Flatten and list packages
        id: flatten
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/packages" -type f -exec mv {} "$RUNNER_TEMP/release/" \;
          echo "package count: $(ls "$RUNNER_TEMP/release" | wc -l)"
          ls -lh "$RUNNER_TEMP/release/"

      - name: Create release index
        run: bash firmware/release-index.sh --dir "$RUNNER_TEMP/release" --version "$VERSION"

      - name: Replace the draft of this tag
        # The same tag again makes the draft again, never a second one. A published release
        # with this tag is never touched.
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$state" in
            none) ;;
            true) gh release delete "$TAG" --yes ;;
            *) echo "$TAG is already published" >&2; exit 1 ;;
          esac

      - name: Create the draft release
        run: |
          count="$(ls "$RUNNER_TEMP/release" | wc -l)"
          [ "$count" -eq 31 ] || { echo "expected 31 files, found $count" >&2; ls "$RUNNER_TEMP/release" >&2; exit 1; }
          gh release create "$TAG" "$RUNNER_TEMP"/release/* --draft \
            --title "TacetOS $VERSION" --notes "Draft, not public before the beta."

      - name: Read the files of the release back
        # GitHub may change a file name; every name and size must be ours.
        run: |
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/online.txt"
          (cd "$RUNNER_TEMP/release" && for f in *; do echo "$f $(stat -c %s "$f")"; done) | sort > "$RUNNER_TEMP/local.txt"
          diff "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/online.txt"
