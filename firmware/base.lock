#
# The pinned base of the TacetOS firmware. Plain KEY=VALUE lines, read by
# apply.sh and build.sh with `source`. Nothing from the base is stored in this
# repository: CI downloads it at the commit below, applies our patches, builds.
#
# This file and backports.md are the only places that name the base project.
# Every name that depends on its layout is kept here, so the scripts stay generic.

# Where the sources come from, and the exact revision we build on (tag v4.0-final).
BASE_URL=https://github.com/Rockbox/rockbox.git
BASE_TAG=v4.0-final
BASE_COMMIT=e094c599fa60236527f9e272e0b8309d7696e399

# Newer commits brought in on top of the base, one full hash each, in order.
# They are fetched from BASE_URL at build time and never copied here. The reason
# for each one is written in backports.md.
BACKPORTS="
94313491ab314634bdca8d727e95b37c983f6142
"

# Names inside the base sources that our scripts need.
TOOLCHAIN_SCRIPT=tools/rockboxdev.sh
# Prefix of the environment variables the toolchain script reads (_PREFIX, _BUILD, _DOWNLOAD).
TOOLCHAIN_ENV=RBDEV
CONFIGURE_SCRIPT=tools/configure
# Argument of the toolchain script for the ARM targets (all ten supported models).
TOOLCHAIN_ARCH=a
# Where the toolchain installs its compiler binaries, relative to its prefix.
TOOLCHAIN_BIN=bin

# Files produced by a build, per build type: N normal, B bootloader, S simulator.
ARTIFACTS_N="rockbox.zip rockbox.ipod"
ARTIFACTS_B="bootloader-*.ipod"
ARTIFACTS_S="rockboxui"

# Reference tools, built only for tests (tests/reference/build-reference-tools.sh).
# Directories inside the base sources, and the files of the partition tool that
# its own build compiles on Linux and macOS.
REF_PARTITION_TOOL_DIR=utils/ipodpatcher
REF_PARTITION_TOOL_SOURCES="main.c ipodpatcher.c fat32format.c arc4.c ipodio-posix.c ipodpatcher-aupd.c"
REF_DFU_TOOL_DIR=utils/mks5lboot
# The Classic DFU parts (tests/reference/build-dfu-parts.sh): the tool's own files that
# its build compiles without USB, the folder of the two programs for the iPod and the
# make targets that build them, the prefix of the ARM compiler, the other folders of
# the sources those programs and the toolchain script need, and the names of the two
# fixed blocks (a structure, its signature field, and an array) in the tool's code.
REF_DFU_TOOL_SOURCES="main.c ipoddfu.c mkdfu.c dualboot.c"
REF_DFU_PAYLOAD_DIR=utils/mks5lboot/dualboot
REF_DFU_PAYLOAD_TARGETS="dualboot_install_ipod6g.arm-bin dualboot_uninstall_ipod6g.arm-bin"
# Name (without extension, inside the tool folder) of the C file made from the programs.
REF_DFU_PAYLOAD_OUTPUT=dualboot
REF_DFU_PLATFORM=ipod6g
REF_DFU_CROSS=arm-elf-eabi-
REF_DFU_FETCH_DIRS="firmware lib/arm_support tools"
REF_DFU_BLOCKS_SOURCE=mkdfu.c
REF_DFU_HEADER_VAR=s5l8702hdr
REF_DFU_SIGNATURE_FIELD=info_sign
REF_DFU_CERTIFICATE_VAR=s5l8702pwnage
