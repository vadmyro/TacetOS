#
# The list of supported iPods. Facts only, written in our own format.
# Every field is described in models/README.md.
#
# Status of this file: all ten models are filled. Classic 6G (the example),
# the six disk models before it (iPod 1G/2G, 3G, 4G, Color, Mini 1G, Mini 2G),
# then iPod Video, Nano 1G and Nano 2G. The facts that are still weak are
# listed in each model's to_verify.
#
# Each model also lists its variants ([model.variant.<key>]): the capacities
# Apple sold, with the release period and the Apple model numbers. See
# models/README.md for the fields and docs/specs/detection.md section 8.4 for
# how the app uses them.

format_version = 1

# ---------------------------------------------------------------------------
# Sources. Every fact of a model points to one or more of these ids.
# ---------------------------------------------------------------------------

[sources.usb-ids]
kind = "database"
title = "Public USB id database (usb.ids)"
location = "https://www.linux-usb.org/usb.ids (read in the copy shipped by the hwdata package of the build machine)"
checked = 2026-11-08

[sources.fw-config]
kind = "firmware-sources"
title = "Device configuration header of the firmware base, one per target"
location = "firmware/export/config/<target>.h in the firmware base (see firmware/base.lock)"
checked = 2026-11-08

[sources.fw-manual]
kind = "firmware-sources"
title = "Manual pages of the firmware base: platform page per model and install chapter"
location = "manual/platform/<target>.tex, manual/getting_started/ipod_install.tex and manual/getting_started/ipod6g_install.tex in the firmware base (see firmware/base.lock)"
checked = 2026-11-08

[sources.installer-devices]
kind = "installer-sources"
title = "Device list of the graphical installer shipped with the firmware base (name, USB id, install method, bootloader file)"
location = "utils/ folder of the firmware base (see firmware/base.lock)"
checked = 2026-11-08

[sources.dfu-pid-table]
kind = "installer-sources"
title = "Table of known DFU product ids in the DFU tool shipped with the firmware base"
location = "utils/ folder of the firmware base (see firmware/base.lock)"
checked = 2026-11-08

[sources.libgpod-table]
kind = "database"
title = "Table of Apple model numbers of the libgpod library: capacity and generation of each model number (facts only, nothing copied)"
location = "https://github.com/hyperair/libgpod/blob/master/src/itdb_device.c (the table of model numbers, read as of the check date)"
checked = 2026-11-09

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------

[[model]]
id = "classic-6g"
family = "classic"
name = "iPod Classic (6th generation)"
bootloader_target = "ipod6g"

# Facts with fewer than two checked sources, or that were assumed. They must
# be confirmed (on a real iPod or in a second source) before the first
# release. Fact names are the keys of [model.sources].
to_verify = ["usb_disk_mode", "storage", "variants"]

# USB ids as "vendor:product" in lowercase hexadecimal. An empty list means
# the mode does not exist on this model. A missing key means not checked yet.
[model.usb]
normal = ["05ac:1261"]
disk_mode = ["05ac:1261"]
dfu = ["05ac:1223"]

[model.screen]
width = 320
height = 240
depth_bits = 16
colour = true
diagonal_inches = 2.5

[model.storage]
kind = "hdd"
form_factor = "1.8in"
interface = "ata"
capacities_gb = [80, 120, 160]

[model.install]
method = "dfu"
dual_boot_required = true

# Source ids for each fact. A fact is confirmed when at least two ids are
# listed and it is not in to_verify.
[model.sources]
family = ["fw-config", "installer-devices"]
name = ["fw-config", "installer-devices"]
usb_normal = ["usb-ids", "fw-config", "installer-devices"]
usb_disk_mode = ["usb-ids"]
usb_dfu = ["usb-ids", "dfu-pid-table"]
screen = ["fw-config", "fw-manual"]
storage = ["fw-config"]
install_method = ["fw-manual", "installer-devices"]
variants = ["libgpod-table", "fw-manual"]
bootloader_target = ["fw-config", "installer-devices"]

# Variants. Two of them share the name "iPod Classic 160 GB": the thick one of
# 2007 and the slim one of 2009. The capacity alone cannot tell them apart,
# only the Apple model number can (detection.md section 8.4). The manual of the
# firmware base confirms the three capacities and the thick and slim bodies.
[model.variant.80gb]
name = "iPod Classic 80 GB"
capacity_gb = 80
released = "late 2007"
apple_models = ["B029", "B147"]
sources = ["libgpod-table", "fw-manual"]
to_verify = ["released", "apple_models"]

[model.variant.160gb-2007]
name = "iPod Classic 160 GB"
capacity_gb = 160
released = "late 2007"
apple_models = ["B145", "B150"]
sources = ["libgpod-table", "fw-manual"]
to_verify = ["released", "apple_models"]

[model.variant.120gb]
name = "iPod Classic 120 GB"
capacity_gb = 120
released = "late 2008"
apple_models = ["B562", "B565"]
sources = ["libgpod-table", "fw-manual"]
to_verify = ["released", "apple_models"]

[model.variant.160gb-2009]
name = "iPod Classic 160 GB"
capacity_gb = 160
released = "late 2009"
apple_models = ["C293", "C297"]
sources = ["libgpod-table", "fw-manual"]
to_verify = ["released", "apple_models"]

# ---------------------------------------------------------------------------
# Disk models before the Classic. They all use the "partition" install method
# (the bootloader goes into the firmware partition of the disk, no DFU), they
# all keep the original firmware reachable, and none of them has a DFU mode.
#
# Capacities, drive sizes and diagonals are not in any source we could read
# offline, so they come from general knowledge only: every model lists
# "storage" in to_verify, and "diagonal_inches" is left out. They must be
# checked against Apple's specification sheets before a release.
# ---------------------------------------------------------------------------

# The first two generations. USB did not exist on them (FireWire only), which
# is what the installer's device list says ("no usb"). The USB id database
# lists an id for the 2nd generation, so "usb_normal" and "usb_disk_mode" stay
# in to_verify until someone plugs one in. The two generations cannot be told
# apart by the bootloader tooling: they share one target.
