name = ["fw-config", "installer-devices"]
usb_normal = ["installer-devices", "fw-config"]
usb_disk_mode = ["installer-devices", "fw-config"]
usb_dfu = ["installer-devices", "fw-manual"]
screen = ["fw-config", "fw-manual"]
storage = ["fw-config", "fw-manual"]
install_method = ["fw-manual", "installer-devices"]
variants = ["libgpod-table"]
