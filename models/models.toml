# The second Nano. Raw NAND flash, and a different chip family from the Nano
# 1G. The bootloader still goes in through the disk (the install tool renames
# files in the firmware partition and uses a bootloader file with its own
# extension), so the method is "partition" and no DFU is used for the install.
# The model does have a low-level USB mode. The DFU id database and the DFU
# tool disagree: the database calls 05ac:1240 "DFU mode" and the tool calls it
# "WTF mode" and lists 05ac:1220 as the DFU one. Both are kept, and usb_dfu
# stays in to_verify. It does not matter for the install.
[[model]]
id = "nano-2g"
family = "nano"
name = "iPod Nano (2nd generation)"
bootloader_target = "ipodnano2g"
to_verify = ["usb_disk_mode", "usb_dfu", "storage", "variants"]

