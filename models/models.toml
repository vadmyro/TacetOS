# ---------------------------------------------------------------------------
# Video and the two Nano generations. They also use the "partition" install
# method and keep the original firmware reachable. Capacities are general
# knowledge only (no offline source), so every model lists "storage" in
# to_verify and leaves "diagonal_inches" out, like the models above.
# ---------------------------------------------------------------------------

# The 5th generation, sold as Video and later as Classic in 2007 (same
# hardware family, same id). Colour screen, 1.8 inch disk.
[[model]]
id = "ipod-video"
family = "ipod"
name = "iPod Video (5th generation)"
bootloader_target = "ipodvideo"
to_verify = ["usb_disk_mode", "storage"]

[model.usb]
normal = ["05ac:1209"]
disk_mode = ["05ac:1209"]
dfu = []

[model.screen]
width = 320
height = 240
depth_bits = 16
colour = true

[model.storage]
kind = "hdd"
form_factor = "1.8in"
interface = "ata"
capacities_gb = [30, 60, 80]

[model.install]
method = "partition"
dual_boot_required = false

[model.sources]
family = ["fw-config", "installer-devices"]
name = ["fw-config", "installer-devices"]
usb_normal = ["usb-ids", "fw-config", "installer-devices"]
usb_disk_mode = ["usb-ids", "installer-devices"]
usb_dfu = ["installer-devices", "fw-manual"]
screen = ["fw-config", "fw-manual"]
storage = ["fw-config", "fw-manual"]
install_method = ["fw-manual", "installer-devices"]
bootloader_target = ["fw-config", "installer-devices"]

# The first Nano. The storage is flash, but the firmware sees it through the
# same ATA interface as the disk models, so "interface" is "ata" here.
[[model]]
id = "nano-1g"
family = "nano"
name = "iPod Nano (1st generation)"
bootloader_target = "ipodnano1g"
to_verify = ["usb_disk_mode", "storage"]

[model.usb]
normal = ["05ac:120a"]
disk_mode = ["05ac:120a"]
dfu = []

[model.screen]
width = 176
height = 132
depth_bits = 16
colour = true

[model.storage]
kind = "flash"
form_factor = "chip"
interface = "ata"
capacities_gb = [1, 2, 4]

[model.install]
method = "partition"
dual_boot_required = false

[model.sources]
family = ["fw-config", "installer-devices"]
name = ["fw-config", "installer-devices"]
usb_normal = ["usb-ids", "fw-config", "installer-devices"]
usb_disk_mode = ["usb-ids", "installer-devices"]
usb_dfu = ["installer-devices", "fw-manual"]
screen = ["fw-config", "fw-manual"]
storage = ["fw-config", "fw-manual"]
install_method = ["fw-manual", "installer-devices"]
bootloader_target = ["fw-config", "installer-devices"]

# The second Nano. Raw NAND flash, and a different chip family from the Nano
# 1G. The bootloader still goes in through the disk (the install tool renames
# files in the firmware partition and uses a bootloader file with its own
# extension), so the method is "partition" and no DFU is used for the install.
# The model does have a low-level USB mode. The DFU id database and the DFU
# tool disagree: the database calls 05ac:1240 "DFU mode" and the tool calls it
# "WTF mode" and lists 05ac:1220 as the DFU one. Both are kept, and usb_dfu
# stays in to_verify. It does not matter for the install.
[[model]]
id = "nano-2g"
family = "nano"
name = "iPod Nano (2nd generation)"
bootloader_target = "ipodnano2g"
to_verify = ["usb_disk_mode", "usb_dfu", "storage"]

[model.usb]
normal = ["05ac:1260"]
disk_mode = ["05ac:1260"]
dfu = ["05ac:1220", "05ac:1240"]

[model.screen]
width = 176
height = 132
depth_bits = 16
colour = true

[model.storage]
kind = "flash"
form_factor = "chip"
interface = "nand"
capacities_gb = [2, 4, 8]

[model.install]
method = "partition"
dual_boot_required = false

[model.sources]
family = ["fw-config", "installer-devices"]
name = ["fw-config", "installer-devices"]
usb_normal = ["usb-ids", "fw-config", "installer-devices"]
usb_disk_mode = ["usb-ids", "installer-devices"]
usb_dfu = ["usb-ids", "dfu-pid-table"]
screen = ["fw-config", "fw-manual"]
storage = ["fw-config", "fw-manual"]
install_method = ["fw-manual", "installer-devices"]
bootloader_target = ["fw-config", "installer-devices"]
